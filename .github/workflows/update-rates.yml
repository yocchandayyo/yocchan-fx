name: レート更新

# トップのレートカードとミニチャートを1時間ごとに作り直す。
# Claudeの定期タスクに依存させないための自動化。
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: レートを取得
        run: python tools/update_rates.py

      - name: 差分があればコミット
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "差分なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "レート更新 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
